<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Account</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <main class="account_form">
      <!-- HEADER-->
      <h1>Edit Account</h1>
      <p class="page_subtitle">Update an existing account.</p>

      <!-- message is displayed when oneis sent from FastAPI -->
      {% if message %}
      <p>{{ message }}</p>
      {% endif %}

      <!--will send the editted account details to FastAPI-->
      <form action="/edit" method="post">
        <label for="account_id">Account ID</label>
        <input
          type="number"
          id="account_id"
          name="account_id"
          min="1"
          required
        />

        <label for="platform_name">Platform Name </label>
        <input type="text" id="platform_name" name="platform_name" required />

        <label for="username">New Username</label>
        <input type="text" id="username" name="username" required />

        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Save Changes</button>
      </form>

      <p><a href="/view.html">Back to Accounts</a></p>
    </main>
  </body>
</html>
